<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSI EDP - Delivery Tracker</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .tracker-box {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 35px 25px;
            text-align: center;
        }

        .title-area h1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .title-area p {
            font-size: 11px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .search-group {
            display: flex;
            background-color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .search-group input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            outline: none;
            font-size: 14px;
            color: #000000;
        }

        .search-group input::placeholder {
            color: #888888;
        }

        .search-group button {
            background-color: #000000;
            color: #ffcc00;
            border: none;
            padding: 0 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-group button:hover {
            background-color: #222222;
        }

        /* Results Area */
        .results-container {
            margin-top: 20px;
            text-align: left;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar */
        .results-container::-webkit-scrollbar {
            width: 6px;
        }
        .results-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .card {
            background-color: #262626;
            border-left: 5px solid #ffcc00;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffcc00;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-intransit { background-color: #e65100; color: #ffe0b2; }
        .status-delivered { background-color: #1b5e20; color: #c8e6c9; }
        .status-pending { background-color: #4a148c; color: #e1bee7; }
        .status-cancelled { background-color: #b71c1c; color: #ffcdd2; }

        .card-body p {
            font-size: 13.5px;
            color: #dddddd;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .card-body span {
            color: #ffcc00;
            font-weight: 600;
            display: inline-block;
            width: 140px; /* Pantay-pantay na alignment ng mga detalye */
        }

        .no-data {
            color: #aaaaaa;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .loading {
            color: #ffcc00;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="tracker-box">
        <div class="title-area">
            <h1>Delivery Tracker</h1>
            <p>RUSI EDP Tracking System</p>
        </div>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Search by Location or Branch...">
            <button id="searchBtn">SEARCH</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="no-data">Enter Branch/Outlet name to start tracking.</div>
        </div>
    </div>

    <script>
        // PALITAN MO ITO NG IYONG GOOGLE APPS SCRIPT URL NA MAY /exec SA DULO
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzc1jsV8BO58xF0zLSKfS7jwsNqub2E9LO4tHIh7Ab8-UgUjWj8NR_TYaoU934dhG6RCg/exec";

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');

        function doSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = '<div class="no-data">Please enter a branch name or location.</div>';
                return;
            }

            resultsContainer.innerHTML = '<div class="loading">Searching database, please wait...</div>';

            // I-fetch ang data gamit ang GET method
            fetch(`${WEB_APP_URL}?search=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    resultsContainer.innerHTML = '';

                    if (data.length === 0 || data.result === "error") {
                        resultsContainer.innerHTML = '<div class="no-data">No records found for your search.</div>';
                        return;
                    }

                    // I-display ang lahat ng columns galing sa Google Sheet
                                     data.forEach(record => {
                        let statusClass = 'status-pending';
                        const statusLower = (record.status || '').toLowerCase();
                        if (statusLower.includes('transit')) statusClass = 'status-intransit';
                        if (statusLower.includes('deliver')) statusClass = 'status-delivered';
                        if (statusLower.includes('cancel')) statusClass = 'status-cancelled';

                        const formattedDate = record.timestamp ? new Date(record.timestamp).toLocaleString() : 'N/A';

                        // Hiwalayin ang bawat line ng History para malinis tingnan
                        const historyLines = record.remarks ? record.remarks.split('\n').map(line => `<div style="color:#aaa; font-size:12px; margin-top:4px; padding-left:10px; border-left: 2px dashed #555;">${line}</div>`).join('') : '<span style="color:#666;">No previous logs</span>';

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-header">
                                <div class="card-title">${record.branch || 'No Branch Assigned'}</div>
                                <span class="status-badge ${statusClass}">${record.status || 'Pending'}</span>
                            </div>
                            <div class="card-body">
                                <p style="color:#ffcc00; font-weight:700; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:4px;">CURRENT LATEST STATUS</p>
                                <p><span>Last Updated:</span> ${formattedDate}</p>
                                <p><span>Location:</span> ${record.location || 'N/A'}</p>
                                <p><span>Item Name:</span> ${record.item || 'N/A'}</p>
                                <p><span>Current Receiver:</span> ${record.receivedBy || 'N/A'}</p>
                                <p><span>Contact Number:</span> ${record.contactNumber || 'N/A'}</p>
                                
                                <p style="color:#ffcc00; font-weight:700; margin-top:15px; margin-bottom:5px; border-bottom:1px solid #333; padding-bottom:4px;">PREVIOUS HISTORY LOGS</p>
                                <div>${historyLines}</div>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });

                })
                .catch(error => {
                    console.error(error);
                    resultsContainer.innerHTML = '<div class="no-data" style="color:#ffcdd2;">System connection error. Please try again.</div>';
                });
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
